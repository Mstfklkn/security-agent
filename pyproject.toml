[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secagent"
version = "0.1.0"
description = "Savunma amaçlı güvenlik denetim ajanı: veri hazırlama, tarayıcılar, (ileride) eğitim ve MCP sunucusu"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
scanners = ["bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
secagent-build = "secagent.dataprep.build:main"
secagent-stats = "secagent.dataprep.stats:main"
secagent-validate = "secagent.schema:main"
secagent-scan = "secagent.scanners.runners:main"
secagent-fetch = "secagent.dataprep.fetch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
